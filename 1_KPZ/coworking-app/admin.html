<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Панель адміністратора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h1 class="mb-4">Панель адміністратора</h1>

    <div class="card shadow-sm mb-5">
        <div class="card-header"><h2 class="h5 mb-0">Керування бронюваннями</h2></div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Простір</th>
                    <th>Клієнт</th>
                    <th>Дати</th>
                    <th>Ціна</th>
                    <th>Статус</th>
                    <th class="text-end">Дії</th>
                </tr>
                </thead>
                <tbody id="bookingsTableBody"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const API_URL = 'http://localhost:3000';
    const bookingsTableBody = document.getElementById('bookingsTableBody');

    async function loadBookings() {
        const response = await fetch(`${API_URL}/api/bookings`);
        const data = await response.json();
        bookingsTableBody.innerHTML = '';
        data.forEach(b => {
            const row = `<tr>
                    <td>${b.booking_id}</td>
                    <td>${b.workspace_name}</td>
                    <td>${b.user_name} (${b.user_email})</td>
                    <td>${new Date(b.start_time).toLocaleDateString()} - ${new Date(b.end_time).toLocaleDateString()}</td>
                    <td>${b.total_price} грн</td>
                    <td><span class="badge bg-${getStatusColor(b.status)}">${b.status}</span></td>
                    <td class="text-end">
                        ${b.status === 'pending' ? `<button class="btn btn-sm btn-success" onclick="updateStatus(${b.booking_id}, 'confirmed')">✓</button>` : ''}
                        ${b.status !== 'canceled' ? `<button class="btn btn-sm btn-warning" onclick="updateStatus(${b.booking_id}, 'canceled')">✗</button>` : ''}
                        <button class="btn btn-sm btn-danger" onclick="deleteBooking(${b.booking_id})">🗑️</button>
                    </td>
                </tr>`;
            bookingsTableBody.innerHTML += row;
        });
    }

    function getStatusColor(status) {
        if (status === 'confirmed') return 'success';
        if (status === 'canceled') return 'danger';
        return 'secondary';
    }

    async function updateStatus(id, status) {
        await fetch(`${API_URL}/api/bookings/${id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
        loadBookings();
    }

    async function deleteBooking(id) {
        if (!confirm('Видалити це бронювання?')) return;
        await fetch(`${API_URL}/api/bookings/${id}`, { method: 'DELETE' });
        loadBookings();
    }

    document.addEventListener('DOMContentLoaded', loadBookings);
</script>
</body>
</html>
