<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коворкінг "Coworkly"</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hero { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url(https://i.imgur.com/example-hero.jpg) center/cover; color: white; padding: 6rem 0; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
<div class="hero text-center">
    <h1 class="display-4">Знайдіть свій ідеальний робочий простір</h1>
    <p class="lead">Комфортні офіси, конференц-зали та кімнати для вашої продуктивної роботи.</p>
</div>

<div class="container mt-5">
    <div id="workspaces-grid" class="row g-4">
    </div>
</div>

<div class="modal fade" id="bookingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Бронювання</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="bookingForm">
                    <input type="hidden" id="workspaceId">
                    <div class="mb-3">
                        <label class="form-label">Ваше ім'я</label>
                        <input type="text" class="form-control" id="userName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Ваш Email</label>
                        <input type="email" class="form-control" id="userEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Дата початку</label>
                        <input type="date" class="form-control" id="startDate" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Дата завершення</label>
                        <input type="date" class="form-control" id="endDate" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Забронювати</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = 'http://localhost:3000';
    const grid = document.getElementById('workspaces-grid');
    const bookingModal = new bootstrap.Modal(document.getElementById('bookingModal'));
    const bookingForm = document.getElementById('bookingForm');
    const modalTitle = document.getElementById('modalTitle');
    const workspaceIdInput = document.getElementById('workspaceId');

    async function loadWorkspaces() {
        const response = await fetch(`${API_URL}/api/workspaces`);
        const data = await response.json();
        grid.innerHTML = '';
        data.forEach(ws => {
            const card = `
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">${ws.name}</h5>
                                <h6 class="card-subtitle mb-2 text-muted">${ws.address}</h6>
                                <p class="card-text">
                                    <strong>Тип:</strong> ${ws.type} | <strong>Місткість:</strong> ${ws.capacity}
                                </p>
                                <p class="fs-4">${ws.price_per_day} грн/день</p>
                                <button class="btn btn-primary" onclick="openBookingModal(${ws.workspace_id}, '${ws.name}')">Забронювати</button>
                            </div>
                        </div>
                    </div>
                `;
            grid.innerHTML += card;
        });
    }

    function openBookingModal(id, name) {
        modalTitle.textContent = `Бронювання: ${name}`;
        workspaceIdInput.value = id;
        bookingModal.show();
    }

    bookingForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const bookingData = {
            workspace_id: workspaceIdInput.value,
            name: document.getElementById('userName').value,
            email: document.getElementById('userEmail').value,
            start_time: document.getElementById('startDate').value,
            end_time: document.getElementById('endDate').value,
        };
        const response = await fetch(`${API_URL}/api/bookings`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bookingData)
        });
        const result = await response.json();
        alert(result.message || result.error);
        if(response.ok) {
            bookingModal.hide();
            bookingForm.reset();
        }
    });

    document.addEventListener('DOMContentLoaded', loadWorkspaces);
</script>
</body>
</html>
